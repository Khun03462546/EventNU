<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../assets/vendors/themify-icons/css/themify-icons.css">
    <link rel="stylesheet" href="../assets/css/meyawo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>EventNU - ผังงาน</title>
    <style>
        .layout-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .layout-page img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .layout-empty {
            color: #666;
        }

        .layout-empty i {
            font-size: 60px;
            color: #EB8826;
            margin-bottom: 16px;
        }

        .layout-back {
            margin-top: 24px;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: #EB8826;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .layout-back:hover {
            background: #d3761d;
        }
    </style>
</head>

<body>
    <div class="layout-page">
        <div id="layoutContent" class="layout-empty">
            <i class="fas fa-map-marked-alt"></i>
            <h3>ยังไม่มีผังงานสำหรับอีเว้นท์นี้</h3>
            <p>กรุณาติดต่อผู้จัดงานเพื่อสอบถามข้อมูลผังงานเพิ่มเติม</p>
        </div>
        <button class="layout-back" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> ย้อนกลับ
        </button>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const imageURL = params.get('img');
            if (imageURL) {
                document.getElementById('layoutContent').outerHTML =
                    `<img src="${imageURL}" alt="ผังงาน">`;
            }
        })();
    </script>
</body>

</html>
