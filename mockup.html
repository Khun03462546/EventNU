<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>EventNU - Prototype Hub</title>
    <style>
        :root {
            --accent: #EB8826;
            --accent-dark: #d3761d;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2b2b2b;
            --muted: #767676;
            --border: #e7e7ec;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Itim', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header.hub-header {
            background: linear-gradient(135deg, var(--accent), #f5a94e);
            color: #fff;
            padding: 40px 20px 60px;
            text-align: center;
        }

        header.hub-header h1 {
            margin: 0 0 8px;
            font-size: 2.2rem;
        }

        header.hub-header p {
            margin: 0;
            opacity: 0.95;
        }

        .hub-wrap {
            max-width: 1100px;
            margin: -36px auto 60px;
            padding: 0 20px;
        }

        nav.role-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 28px;
        }

        nav.role-tabs button {
            border: none;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Itim', sans-serif;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            color: var(--text);
            transition: all .15s ease;
        }

        nav.role-tabs button.active,
        nav.role-tabs button:hover {
            background: var(--accent);
            color: #fff;
        }

        section.role-panel {
            display: none;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        section.role-panel.active {
            display: block;
        }

        .role-panel-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .role-panel-title i {
            color: var(--accent);
            font-size: 1.6rem;
        }

        .role-panel-title h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .role-panel-desc {
            color: var(--muted);
            margin: 0 0 22px;
        }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .page-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .page-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(235, 136, 38, 0.18);
            border-color: var(--accent);
        }

        .page-card .icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(235, 136, 38, 0.12);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .page-card .title {
            font-weight: 600;
            font-size: 1.02rem;
        }

        .page-card .file {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: monospace;
            word-break: break-all;
        }

        footer.hub-footer {
            text-align: center;
            color: var(--muted);
            padding: 10px 20px 40px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header class="hub-header">
        <h1><i class="fas fa-calendar-check"></i> EventNU Prototype Hub</h1>
        <p>คลิกเพื่อเปิดหน้า HTML จริงของแต่ละบทบาทในระบบ</p>
    </header>

    <div class="hub-wrap">
        <nav class="role-tabs" id="roleTabs"></nav>
        <div id="rolePanels"></div>
    </div>

    <footer class="hub-footer">
        หน้านี้เป็นเพียงจุดเชื่อมโยง (index) สำหรับดูหน้า HTML ที่มีอยู่จริงในโปรเจกต์ ไม่ใช่หน้าใช้งานจริงของระบบ
    </footer>

    <script>
        const roles = [
            {
                key: "audience",
                icon: "fas fa-user",
                title: "Audience",
                subtitle: "ผู้เข้าร่วมงาน",
                desc: "หน้าจอฝั่งผู้ใช้ทั่วไปที่เข้ามาดูอีเว้นท์ จองบัตร และติดตามสถานะการซื้อ",
                pages: [
                    { file: "Audience/home.html", title: "หน้าแรก", icon: "bi bi-house-door" },
                    { file: "Audience/details.html", title: "รายละเอียดอีเว้นท์", icon: "bi bi-info-circle" },
                    { file: "Audience/openlayout.html", title: "ผังงาน", icon: "bi bi-map" },
                    { file: "Audience/registerForFree.html", title: "ลงทะเบียนฟรี", icon: "bi bi-pencil-square" },
                    { file: "Audience/registerForPaid.html", title: "ลงทะเบียนแบบเสียเงิน", icon: "bi bi-credit-card" },
                    { file: "Audience/payment.html", title: "ชำระเงิน", icon: "bi bi-wallet2" },
                    { file: "Audience/status.html", title: "สถานะการจอง", icon: "bi bi-hourglass-split" },
                    { file: "Audience/buy.html", title: "คำสั่งซื้อของฉัน", icon: "bi bi-bag-check" },
                    { file: "Audience/ticketsoon.html", title: "บัตรของฉัน", icon: "bi bi-ticket-perforated" },
                    { file: "Audience/ticketdetail.html", title: "รายละเอียดบัตร", icon: "bi bi-ticket-detailed" },
                    { file: "Audience/favorite.html", title: "อีเว้นท์ที่ติดตาม", icon: "bi bi-heart" },
                    { file: "Audience/followrequest.html", title: "จัดอีเว้นท์ / คำขอ", icon: "bi bi-send" },
                    { file: "Audience/feedback.html", title: "ความคิดเห็น", icon: "bi bi-chat-dots" },
                    { file: "Audience/private.html", title: "ข้อมูลส่วนตัว", icon: "bi bi-person-gear" },
                ]
            },
            {
                key: "committee",
                icon: "fas fa-users",
                title: "Committee",
                subtitle: "คณะกรรมการ",
                desc: "หน้าจอสำหรับกรรมการตรวจสอบข้อมูล ประเมินผล และดูงบประมาณอีเว้นท์",
                pages: [
                    { file: "Committee/home.html", title: "หน้าแรก", icon: "bi bi-house-door" },
                    { file: "Committee/details.html", title: "รายละเอียดอีเว้นท์", icon: "bi bi-info-circle" },
                    { file: "Committee/detailsInfo.html", title: "ข้อมูลรายละเอียด", icon: "bi bi-card-list" },
                    { file: "Committee/checkInfo.html", title: "ตรวจสอบข้อมูล", icon: "bi bi-clipboard-check" },
                    { file: "Committee/assessment.html", title: "ประเมินผล", icon: "bi bi-star" },
                    { file: "Committee/budget.html", title: "งบประมาณ", icon: "bi bi-cash-coin" },
                    { file: "Committee/setting.html", title: "ตั้งค่า", icon: "bi bi-gear" },
                ]
            },
            {
                key: "organizer",
                icon: "fas fa-clipboard-list",
                title: "Event Organizer",
                subtitle: "ผู้จัดอีเว้นท์",
                desc: "หน้าจอสำหรับผู้จัดงานดูรายละเอียดอีเว้นท์ของตนเอง สรุปผล และรายจ่าย",
                pages: [
                    { file: "EventOrganizer/home.html", title: "หน้าแรก", icon: "bi bi-house-door" },
                    { file: "EventOrganizer/details.html", title: "รายละเอียดอีเว้นท์", icon: "bi bi-info-circle" },
                    { file: "EventOrganizer/myEventDetails.html", title: "อีเว้นท์ของฉัน", icon: "bi bi-journal-bookmark" },
                    { file: "EventOrganizer/expense.html", title: "รายจ่าย", icon: "bi bi-receipt" },
                    { file: "EventOrganizer/private.html", title: "ข้อมูลส่วนตัว", icon: "bi bi-person-gear" },
                ]
            },
            {
                key: "president",
                icon: "fas fa-user-tie",
                title: "President",
                subtitle: "ผู้บริหาร",
                desc: "หน้าจอสำหรับผู้บริหารอนุมัติคำขอจัดอีเว้นท์ ติดตามคำสั่งซื้อ และดูสรุปผล",
                pages: [
                    { file: "President/home.html", title: "หน้าแรก", icon: "bi bi-house-door" },
                    { file: "President/approveEvent.html", title: "อนุมัติขอจัดอีเว้นท์", icon: "bi bi-check2-square" },
                    { file: "President/approveEventdetail.html", title: "รายละเอียดคำขอ", icon: "bi bi-file-earmark-text" },
                    { file: "President/eventAllpre.html", title: "อีเว้นท์ทั้งหมด", icon: "bi bi-calendar3" },
                    { file: "President/checkBack.html", title: "คำสั่งซื้อทั้งหมด", icon: "bi bi-bag-check" },
                    { file: "President/checkBack2.html", title: "คำสั่งซื้อทั้งหมด (2)", icon: "bi bi-bag-check" },
                    { file: "President/followSum.html", title: "ติดตามอีเว้นท์", icon: "bi bi-graph-up" },
                    { file: "President/presidentDashboard.html", title: "แดชบอร์ด", icon: "bi bi-speedometer2" },
                    { file: "President/detail.html", title: "รายละเอียด", icon: "bi bi-info-circle" },
                    { file: "President/setting.html", title: "ตั้งค่า", icon: "bi bi-gear" },
                ]
            },
            {
                key: "studentaffairs",
                icon: "fas fa-building-columns",
                title: "Student Affairs",
                subtitle: "ฝ่ายกิจการนิสิต",
                desc: "หน้าจอสำหรับฝ่ายกิจการนิสิตจัดการอีเว้นท์ คำสั่งซื้อ และบทบาทผู้ใช้งาน",
                pages: [
                    { file: "StudentAffairs/home.html", title: "หน้าแรก", icon: "bi bi-house-door" },
                    { file: "StudentAffairs/eventAll.html", title: "อีเว้นท์ทั้งหมด", icon: "bi bi-calendar3" },
                    { file: "StudentAffairs/allOrder.html", title: "คำสั่งซื้อทั้งหมด", icon: "bi bi-bag-check" },
                    { file: "StudentAffairs/allOrder2.html", title: "คำสั่งซื้อทั้งหมด (2)", icon: "bi bi-bag-check" },
                    { file: "StudentAffairs/changeRole.html", title: "เปลี่ยนโรล", icon: "bi bi-person-plus" },
                    { file: "StudentAffairs/HTML/addEvent.html", title: "เพิ่มอีเว้นท์", icon: "bi bi-clipboard2-plus" },
                    { file: "StudentAffairs/HTML/affairDashboard.html", title: "แดชบอร์ด", icon: "bi bi-speedometer2" },
                    { file: "StudentAffairs/HTML/details.html", title: "รายละเอียดอีเว้นท์", icon: "bi bi-info-circle" },
                    { file: "StudentAffairs/HTML/followevent.html", title: "การดำเนินการขอจัดอีเว้นท์", icon: "bi bi-send" },
                    { file: "StudentAffairs/HTML/setting.html", title: "ตั้งค่า", icon: "bi bi-gear" },
                ]
            },
        ];

        const tabsEl = document.getElementById("roleTabs");
        const panelsEl = document.getElementById("rolePanels");

        roles.forEach((role, idx) => {
            const btn = document.createElement("button");
            btn.textContent = role.title;
            btn.dataset.key = role.key;
            if (idx === 0) btn.classList.add("active");
            btn.addEventListener("click", () => showRole(role.key));
            tabsEl.appendChild(btn);

            const panel = document.createElement("section");
            panel.className = "role-panel" + (idx === 0 ? " active" : "");
            panel.id = "panel-" + role.key;

            const cardsHtml = role.pages.map(p => `
                <a class="page-card" href="${p.file}">
                    <div class="icon"><i class="${p.icon}"></i></div>
                    <div class="title">${p.title}</div>
                    <div class="file">${p.file}</div>
                </a>
            `).join("");

            panel.innerHTML = `
                <div class="role-panel-title">
                    <i class="${role.icon}"></i>
                    <h2>${role.title} <small style="font-weight:400;color:var(--muted);font-size:1rem;">(${role.subtitle})</small></h2>
                </div>
                <p class="role-panel-desc">${role.desc}</p>
                <div class="page-grid">${cardsHtml}</div>
            `;
            panelsEl.appendChild(panel);
        });

        function showRole(key) {
            document.querySelectorAll("nav.role-tabs button").forEach(b => {
                b.classList.toggle("active", b.dataset.key === key);
            });
            document.querySelectorAll("section.role-panel").forEach(p => {
                p.classList.toggle("active", p.id === "panel-" + key);
            });
        }
    </script>
</body>

</html>
